<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Face Projection (Camera)</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #00ff00; font-family: monospace; }
      main { height: 100vh; height: 100dvh; display: flex; flex-direction: column; gap: 10px; padding: 12px; box-sizing: border-box; }
      #status { text-align: center; font-size: 15px; }
      #status.bad { color: #ff5555; }
      #preview { flex: 1 1 0; min-height: 0; width: 100%; object-fit: contain; background: #111; border: 2px solid #00ff00; box-sizing: border-box; }
      .row { display: flex; gap: 10px; }
      button, select { flex: 1; min-width: 0; padding: 16px 8px; border: none; border-radius: 8px; background: #00ff00; color: #000; font: 16px monospace; cursor: pointer; }
      small { text-align: center; opacity: 0.7; }
    </style>
  </head>
  <body>
    <main>
      <div id="status">Starting...</div>
      <video id="preview" playsinline muted autoplay></video>
      <div class="row">
        <select id="cams"></select>
        <button id="flip">Flip camera</button>
      </div>
      <small id="tip">Tip: hold the phone sideways (landscape) and keep it still, ideally on a stand.</small>
      <small id="code"></small>
    </main>
    <script>
// Turns this device (a phone, a tablet, another laptop) into the camera for the face projection sketch.
// Open it on the device, allow the camera, and the sketch on the main computer uses this picture.

// Same pairing code as the sketch page, so it connects on its own. To use your own code, put it in both addresses:
// sketch.html#MYCODE and camera.html#MYCODE.
const DEFAULT_CODE = 'FP-X7K2Q9M4';
const PAIRING_CODE = (location.hash.slice(1) || DEFAULT_CODE).toUpperCase();

const $ = (id) => document.getElementById(id);
let stream = null;
let peer = null;
// The app can show two separate displays (A and B). This camera feeds every display that is open.
const SUFFIXES = ['', '-B'];
const calls = {}; // suffix -> the connection carrying our picture to that display
let facing = 'environment'; // start on the back camera, which is usually the one you want
let retryTimer = null;

function say(text, bad) {
  $('status').textContent = text;
  $('status').className = bad ? 'bad' : '';
}

// Normally the free PeerJS cloud introduces the devices to each other. To use your own PeerJS server instead,
// add ?peerhost=HOST&peerport=PORT (and &secure=1 for https) to the address.
function peerOptions() {
  const q = new URLSearchParams(location.search);
  const host = q.get('peerhost');
  return host ? { host, port: Number(q.get('peerport')) || 9000, path: q.get('peerpath') || '/', secure: q.get('secure') === '1' } : {};
}

async function startCamera(deviceId) {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  const video = deviceId
    ? { deviceId: { exact: deviceId }, width: { ideal: 1280 }, height: { ideal: 720 } }
    : { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } };
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video, audio: false });
  } catch (e) {
    say('Could not open the camera: ' + e.name + '. Allow camera access and reload.', true);
    return;
  }
  $('preview').srcObject = stream;
  await fillCameraList();

  const track = stream.getVideoTracks()[0];
  try { track.contentHint = 'detail'; } catch (e) {} // tell the browser sharpness matters more than smoothness
  const senders = videoSenders();
  if (senders.length) senders.forEach((s) => s.replaceTrack(track)); // already streaming: swap the picture without reconnecting
  else connectToSketch();
}

async function fillCameraList() {
  const devices = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'videoinput');
  const active = stream && stream.getVideoTracks()[0] && stream.getVideoTracks()[0].getSettings().deviceId;
  $('cams').innerHTML = '';
  devices.forEach((d, i) => {
    const o = document.createElement('option');
    o.value = d.deviceId;
    o.textContent = d.label || `Camera ${i + 1}`;
    if (d.deviceId === active) o.selected = true;
    $('cams').appendChild(o);
  });
}

// Face tracking needs a sharp picture. By default the connection quietly lowers the resolution when the network
// is busy; ask it to lower the frame rate instead, and allow a higher quality.
const tuned = new Set();
function tuneSender() {
  for (const sender of videoSenders()) {
    if (tuned.has(sender)) continue;
    tuned.add(sender);
    try {
      const params = sender.getParameters();
      if (!params.encodings || !params.encodings.length) params.encodings = [{}];
      params.degradationPreference = 'maintain-resolution';
      params.encodings[0].maxBitrate = 6000000;
      sender.setParameters(params).catch(() => {});
    } catch (e) {}
  }
}

function videoSenders() {
  const out = [];
  for (const call of Object.values(calls)) {
    const s = call.peerConnection && call.peerConnection.getSenders().find((x) => x.track && x.track.kind === 'video');
    if (s) out.push(s);
  }
  return out;
}

function connectToSketch() {
  clearTimeout(retryTimer);
  if (!peer || !peer.open || !stream) return;
  for (const suffix of SUFFIXES) {
    if (calls[suffix]) continue; // already connected to that display
    const call = peer.call('faceproj-' + PAIRING_CODE + suffix, stream);
    calls[suffix] = call;
    const lost = () => {
      if (calls[suffix] === call) delete calls[suffix];
      showStatus();
    };
    call.on('close', lost);
    call.on('error', lost);
  }
  showStatus();
  // keep looking, so a display that is opened later (or restarted) gets this camera too
  retryTimer = setTimeout(connectToSketch, 4000);
}

// how many displays are actually receiving this camera
function connectedCount() {
  return Object.values(calls).filter((call) => {
    const st = call.peerConnection && call.peerConnection.iceConnectionState;
    return st === 'connected' || st === 'completed';
  }).length;
}

function showStatus() {
  const n = connectedCount();
  if (n > 0) {
    say(n === 1 ? 'Streaming this camera to the sketch' : `Streaming this camera to ${n} displays`);
    tuneSender();
  } else {
    say('Looking for the sketch... Open it on the main computer first.', Object.keys(calls).length === 0);
  }
}

setInterval(() => {
  // drop connections that failed, so the next attempt makes a fresh one
  for (const [suffix, call] of Object.entries(calls)) {
    const st = call.peerConnection && call.peerConnection.iceConnectionState;
    if (st === 'failed' || st === 'closed') delete calls[suffix];
  }
  if (stream) showStatus();
}, 1000);

$('flip').addEventListener('click', () => {
  facing = facing === 'user' ? 'environment' : 'user';
  startCamera();
});
$('cams').addEventListener('change', () => startCamera($('cams').value));

peer = new Peer(undefined, peerOptions());
peer.on('open', () => startCamera());
peer.on('disconnected', () => peer.reconnect());
peer.on('error', (err) => {
  if (err.type === 'peer-unavailable') {
    // that display is not open (normal for display B when it is switched off): forget the attempt, the retry loop tries again
    const suffix = /-B\s*$/.test(err.message || '') ? '-B' : '';
    if (calls[suffix]) {
      try { calls[suffix].close(); } catch (e) {}
      delete calls[suffix];
    }
    showStatus();
  } else {
    say('Connection problem: ' + err.type, true);
  }
});
$('code').textContent = 'pairing code ' + PAIRING_CODE;

// keep the screen from going to sleep while streaming
if (navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && navigator.wakeLock) navigator.wakeLock.request('screen').catch(() => {});
});
    </script>
  </body>
</html>
