<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Face Projection</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
    <style>
      html, body { margin: 0; background: #111; }
      main { display: flex; flex-direction: column; align-items: center; padding-bottom: 20px; }
    </style>
  </head>
  <body>
    <main></main>
    <div id="status" style="position:fixed;top:0;left:0;right:0;padding:6px 10px;background:#333;color:#fff;font:13px sans-serif;z-index:9">Loading libraries...</div>
    <script>
      // show problems on the page itself, since the console may not be visible
      const statusEl = document.getElementById('status');
      window.addEventListener('error', (e) => {
        statusEl.style.background = '#a00';
        statusEl.textContent = 'Error: ' + e.message + (e.target && e.target.src ? ' (' + e.target.src + ')' : '');
      }, true);
      window.addEventListener('load', () => {
        if (typeof p5 === 'undefined' || typeof ml5 === 'undefined') {
          statusEl.style.background = '#a00';
          statusEl.textContent = 'Could not load ' + (typeof p5 === 'undefined' ? 'p5' : 'ml5') + ' from the CDN (check internet / blocked scripts).';
        } else {
          statusEl.textContent = 'Libraries loaded. Allow camera access when asked...';
        }
      });
    </script>
    <script>
let video;
let faceMesh;
let faces = [];

// Each feature is a fixed-size square region of the video that gets blown up to fill the canvas.
// "left"/"right" are the subject's own sides, which is also what the mirrored view shows.
// Nose uses a single face keypoint (1 = nose tip) since faceMesh has no nose region.
const FEATURES = [
  { label: 'Left Eye',      size: 100, center: (f) => f.leftEye },
  { label: 'Right Eye',     size: 100, center: (f) => f.rightEye },
  { label: 'Left Eyebrow',  size: 110, center: (f) => f.leftEyebrow },
  { label: 'Right Eyebrow', size: 110, center: (f) => f.rightEyebrow },
  { label: 'Nose',          size: 90,  center: (f) => f.keypoints[1] },
  { label: 'Mouth',         size: 130, center: (f) => f.lips },
];

const MIN_SIZE = 20;
const MAX_SIZE = 300;
const SMOOTHING = 0.35; // 0..1, higher = follows faster; smoothing keeps the zoomed image steady
const INSET = 180;      // size of the small full-view preview in the corner

let current = 0;
let slider;
const buttons = [];

const ON_COLOR = '#2ecc71';
const OFF_COLOR = '#555555';

// GUI layout: three columns (indexes into FEATURES)
const COLUMNS = [
  { title: 'Left',   features: [0, 2] },
  { title: 'Center', features: [4, 5] },
  { title: 'Right',  features: [1, 3] },
];
let smoothX = null;
let smoothY = null;

function preload() {
  faceMesh = ml5.faceMesh({ maxFaces: 1 });
}

function setup() {
  const cnv = createCanvas(800, 800);
  cnv.parent(select('main'));
  video = createCapture({ video: { width: 800, height: 800 }, audio: false });
  video.size(800, 800);
  video.hide();
  faceMesh.detectStart(video, (results) => (faces = results));
  const st = document.getElementById('status');
  if (st) st.remove();
  buildGui();
}

function buildGui() {
  const gui = createDiv();
  gui.parent(select('main'));
  gui.style('display', 'grid');
  gui.style('grid-template-columns', '1fr 1fr 1fr');
  gui.style('gap', '12px');
  gui.style('width', '800px');
  gui.style('margin-top', '12px');

  for (const col of COLUMNS) {
    const colDiv = createDiv();
    colDiv.parent(gui);
    colDiv.style('display', 'flex');
    colDiv.style('flex-direction', 'column');
    colDiv.style('gap', '8px');

    const title = createDiv(col.title);
    title.parent(colDiv);
    title.style('color', '#ccc');
    title.style('font-family', 'sans-serif');
    title.style('text-align', 'center');
    title.style('text-transform', 'uppercase');
    title.style('letter-spacing', '2px');
    title.style('font-size', '12px');

    for (const idx of col.features) {
      const btn = createButton(FEATURES[idx].label);
      btn.parent(colDiv);
      btn.style('padding', '10px');
      btn.style('border', 'none');
      btn.style('border-radius', '6px');
      btn.style('color', 'white');
      btn.style('font-family', 'sans-serif');
      btn.style('font-size', '14px');
      btn.style('cursor', 'pointer');
      btn.mousePressed(() => select_feature(idx));
      buttons[idx] = btn;
    }
  }

  // size slider (flipped): higher value = smaller box = more zoomed in
  const sliderRow = createDiv();
  sliderRow.parent(select('main'));
  sliderRow.style('width', '800px');
  sliderRow.style('margin-top', '12px');
  sliderRow.style('display', 'flex');
  sliderRow.style('align-items', 'center');
  sliderRow.style('gap', '10px');
  sliderRow.style('color', '#ccc');
  sliderRow.style('font-family', 'sans-serif');
  sliderRow.style('font-size', '12px');
  createSpan('BOX SIZE: LARGE').parent(sliderRow);
  slider = createSlider(MIN_SIZE, MAX_SIZE, sizeToSlider(FEATURES[0].size), 1);
  slider.parent(sliderRow);
  slider.style('flex', '1');
  slider.input(() => (FEATURES[current].size = sliderToSize(slider.value())));
  createSpan('SMALL').parent(sliderRow);

  updateGui();
}

// the slider is flipped: box size = MIN + MAX - slider value
function sliderToSize(v) {
  return MIN_SIZE + MAX_SIZE - v;
}
const sizeToSlider = sliderToSize; // the flip is its own inverse

function select_feature(idx) {
  current = idx;
  smoothX = null; // jump straight to the new feature instead of gliding across the face
  updateGui();
}

function cycle(dir) {
  select_feature((current + dir + FEATURES.length) % FEATURES.length);
}

function updateGui() {
  buttons.forEach((btn, i) => btn.style('background-color', i === current ? ON_COLOR : OFF_COLOR));
  slider.value(sizeToSlider(FEATURES[current].size));
}

function keyPressed() {
  if (keyCode === RIGHT_ARROW || key === ' ') cycle(1);
  if (keyCode === LEFT_ARROW) cycle(-1);
}

function draw() {
  background(0);

  const vw = video.elt.videoWidth || video.width;
  const vh = video.elt.videoHeight || video.height;

  const f = FEATURES[current];
  const face = faces[0];
  const p = face && f.center(face);

  if (p) {
    const px = p.centerX !== undefined ? p.centerX : p.x;
    const py = p.centerY !== undefined ? p.centerY : p.y;
    smoothX = smoothX === null ? px : lerp(smoothX, px, SMOOTHING);
    smoothY = smoothY === null ? py : lerp(smoothY, py, SMOOTHING);
  }

  if (smoothX === null) {
    // no face yet: show the plain mirrored camera so it's clear the sketch is alive
    push();
    translate(width, 0);
    scale(-1, 1);
    image(video, 0, 0, width, height);
    pop();
    fill(0, 160);
    noStroke();
    rect(0, height / 2 - 30, width, 60);
    fill(255);
    textSize(24);
    textAlign(CENTER, CENTER);
    text(faces.length === 0 ? 'Looking for a face...' : 'Face found, tracking...', width / 2, height / 2);
    return;
  }

  // the square in raw video pixels (canvas size -> video size), kept fully inside the frame
  const sw = f.size * (vw / width);
  const sh = f.size * (vh / height);
  const sx = constrain(smoothX - sw / 2, 0, vw - sw);
  const sy = constrain(smoothY - sh / 2, 0, vh - sh);

  // project what's inside the square across the whole canvas, mirrored like a selfie view.
  // Uses the canvas API directly so the crop is taken in the camera's true pixel coordinates.
  const ctx = drawingContext;
  ctx.save();
  ctx.translate(width, 0);
  ctx.scale(-1, 1);
  ctx.drawImage(video.elt, sx, sy, sw, sh, 0, 0, width, height);
  ctx.restore();

  drawInset(vw, vh, sx, sy, sw, sh);
}

// small mirrored preview of the full camera with the current square outlined
function drawInset(vw, vh, sx, sy, sw, sh) {
  const m = 16;
  const ix = width - INSET - m;
  const iy = height - INSET - m;
  push();
  translate(ix + INSET, iy);
  scale(-1, 1);
  image(video, 0, 0, INSET, INSET);
  pop();

  noFill();
  stroke(255);
  strokeWeight(2);
  const k = INSET / vw;
  const kh = INSET / vh;
  // mirror x to match the flipped preview
  rect(ix + INSET - (sx + sw) * k, iy + sy * kh, sw * k, sh * kh);
  rect(ix, iy, INSET, INSET);
}

    </script>
  </body>
</html>
