<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Face Projection (Sketch)</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
    <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
      html, body { margin: 0; background: #000; width: 100%; height: 100%; overflow: hidden; }
      main { width: 100vw; height: 100vh; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <main></main>
    <div id="status" style="display:none;position:fixed;top:0;left:0;right:0;padding:6px 10px;background:#a00;color:#fff;font:13px sans-serif;z-index:9"></div>
    <script>
      // the page shows nothing but the canvas; this red bar only appears if something breaks
      const statusEl = document.getElementById('status');
      function showProblem(text) {
        statusEl.textContent = text;
        statusEl.style.display = 'block';
      }
      window.addEventListener('error', (e) => {
        showProblem('Error: ' + e.message + (e.target && e.target.src ? ' (' + e.target.src + ')' : ''));
      }, true);
      window.addEventListener('load', () => {
        if (typeof p5 === 'undefined' || typeof ml5 === 'undefined' || typeof Peer === 'undefined') {
          showProblem('Could not load ' + (typeof p5 === 'undefined' ? 'p5' : typeof ml5 === 'undefined' ? 'ml5' : 'PeerJS') + ' from the CDN (check internet / blocked scripts).');
        }
      });
    </script>
    <script>
let video;
let faceMesh;
let faces = [];

// Each feature is a fixed-size square region of the video.
// "left"/"right" are the subject's own sides, which is also what the mirrored view shows.
// Nose uses a single face keypoint (1 = nose tip) since faceMesh has no nose region.
// The ORDER matters: the controller refers to features by their index here.
const FEATURES = [
  { label: 'Left Eye',      size: 100, center: (f) => f.leftEye },
  { label: 'Right Eye',     size: 100, center: (f) => f.rightEye },
  { label: 'Left Eyebrow',  size: 110, center: (f) => f.leftEyebrow },
  { label: 'Right Eyebrow', size: 110, center: (f) => f.rightEyebrow },
  { label: 'Nose',          size: 90,  center: (f) => f.keypoints[1] },
  { label: 'Mouth',         size: 130, center: (f) => f.lips },
];

const MIN_SIZE = 20;
const MAX_SIZE = 300;
const MIN_ZOOM = 1;
const MAX_ZOOM = 5;
const RANDOM_MAX_ZOOM = 2.5; // Randomize only picks zooms up to this
const MAX_PEOPLE = 4;        // how many faces are tracked at once
const GRACE_MS = 800;        // a person who drops out of detection for this long counts as gone
const SMOOTHING = 0.35;      // 0..1, higher = follows faster; smoothing keeps the zoomed image steady
const MODES = ['none', 'mono', 'duo'];

// ---- what the controller changes ----
let current = 0; // the feature whose size the controller's slider edits (last one switched on)
const selected = new Set([0]); // features can be highlighted together (or none at all)
let zoom = 1;                  // magnification of the footage inside the box (1 = none)
let bodyTrace = false;         // fill the person's silhouette with a mosaic of the highlighted features
let screenTrace = false;       // fill the whole screen with that mosaic
let fullView = false;          // true = main canvas shows the whole camera view instead of the zoomed features
let showLabels = false;        // write each highlighted feature's name in the center of its box
let fxIn = 'none';             // 'none' | 'mono' | 'duo': filter for the footage inside the boxes
let fxOut = 'none';            // ...and for everything outside them

// ---- people ----
const smooth = {}; // smoothed position per person+feature, keyed 'personId:featureIndex'
const tracks = []; // everyone currently in frame: { id, x, y, face, lastSeen }
let nextPersonId = 1;
let peopleKey = ''; // which people are in frame; when it changes the features get shuffled between them
const perms = {};   // featureIndex -> { personId: id of the person whose feature is shown on them }

// ---- layout / cameras / connection ----
const BTN_COLOR = '#00ff00';
const MONO = 'monospace';
const PREVIEW = 300; // width of the small full-camera preview sent to the iPad (its height follows the camera's shape)
let preview;
let cameras = [];        // [{ id, label }] for the controller's camera list
let activeCamera = null;
let peer;                // PeerJS connection point; the iPad connects to it using the pairing code
const links = new Set(); // open connections to controllers (normally just the iPad)
// Both pages use the same pairing code, so the iPad connects on its own. Put your own code in the web address
// (sketch.html#MYCODE on the laptop, controller.html#MYCODE on the iPad) to keep other people out.
const DEFAULT_CODE = 'FP-X7K2Q9M4';
const PAIRING_CODE = (location.hash.slice(1) || DEFAULT_CODE).toUpperCase();
let lastPreviewAt = 0;

// ---- body trace (mosaic) ----
const MIN_TILE = 14;     // smallest / largest mosaic tile, in "800 pixel screen" units like the box sizes
const MAX_TILE = 120;
let tileSize = 28;       // current mosaic tile size (the controller's Tile Size slider)
const SEG_WIDTH = 256;   // the body model looks at a small copy of the picture (fast), this wide
let bodySeg = null;      // ml5 body segmentation model, only loaded the first time Body Trace is switched on
let bodySegReady = false;
let bodySegRunning = false;
let segCanvas = null;    // the small picture the body model looks at
let latestMask = null;   // newest silhouette: ImageData in the camera's own (unmirrored) orientation
let maskPersonOpaque = true; // which way round the mask is: is the person the opaque part? (worked out live)
let mosaicCells = [];    // one remembered random choice per tile: { fi: feature index, pid: person id }
let mosaicKey = '';

function preload() {
  faceMesh = ml5.faceMesh({ maxFaces: MAX_PEOPLE });
}

function setup() {
  pixelDensity(1); // the camera picture is far smaller than a retina screen anyway, and this keeps it fast
  const cnv = createCanvas(windowWidth, windowHeight);
  cnv.parent(select('main'));

  // the small full-camera view lives on the iPad: it is drawn here (hidden) and sent over as pictures
  preview = createGraphics(PREVIEW, PREVIEW);
  preview.pixelDensity(1);

  startCamera(null); // null = the browser's default camera; the controller can pick another
  connect();
}

// the canvas always fills the whole window, whatever its shape
function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
}

function draw() {
  background(0);

  const vw = video.elt.videoWidth || video.width;
  const vh = video.elt.videoHeight || video.height;
  const view = coverView(vw, vh);

  updatePeople();

  // follow every highlighted feature on every person in frame (for Body Trace with nothing highlighted: all of them)
  const inUse = (bodyTrace || screenTrace) && selected.size === 0 ? new Set(FEATURES.map((_, i) => i)) : selected;
  inUse.forEach((idx) => {
    const f = FEATURES[idx];
    for (const t of tracks) {
      const p = f.center(t.face);
      if (!p) continue;
      const px = p.centerX !== undefined ? p.centerX : p.x;
      const py = p.centerY !== undefined ? p.centerY : p.y;
      const key = `${t.id}:${idx}`;
      const prev = smooth[key];
      smooth[key] = prev ? { x: lerp(prev.x, px, SMOOTHING), y: lerp(prev.y, py, SMOOTHING) } : { x: px, y: py };
    }
  });

  // one box per person per highlighted feature. The box sits on that person's feature (`at`), but what it shows
  // comes from whoever the shuffle assigned (`from`), so features appear to swap between people.
  const boxes = [];
  selected.forEach((idx) => {
    const f = FEATURES[idx];
    const side = boxSide(vw, vh, f.size);
    for (const t of tracks) {
      const at = smooth[`${t.id}:${idx}`];
      if (!at) continue;
      const fromId = (perms[idx] && perms[idx][t.id]) || t.id;
      const from = smooth[`${fromId}:${idx}`] || at;
      boxes.push({ at, from, side, label: f.label });
    }
  });

  const ctx = drawingContext;

  // mosaic: the person's silhouette (Body Trace) or the whole screen (Screen Trace) filled with the highlighted features
  if (bodyTrace || screenTrace) {
    drawMosaic(ctx, vw, vh, view, inUse);
    maybeSendPreview(vw, vh, boxes);
    return;
  }

  // whole camera view: when Full View is on, or when no feature is highlighted (no box)
  if (fullView || selected.size === 0) {
    drawFiltered(ctx, view.src, 0, 0, width, height, fxOut);
    for (const b of boxes) {
      const d = view.toCanvas(squareRect(vw, vh, b.at, b.side));
      // redraw the box on top so the outside filter never touches it
      drawFiltered(ctx, zoomedIn(squareRect(vw, vh, b.from, b.side)), d.x, d.y, d.w, d.h, fxIn);
      noFill();
      stroke(BTN_COLOR);
      strokeWeight(2);
      rect(d.x, d.y, d.w, d.h);
      if (showLabels) drawLabel(ctx, b.label, d.x + d.w / 2, d.y + d.h / 2, constrain(Math.min(width, height) / 40, 14, 40));
    }
    maybeSendPreview(vw, vh, boxes);
    return;
  }

  if (boxes.length === 0) {
    // no face yet: show the plain mirrored camera so it's clear the sketch is alive
    drawFiltered(ctx, view.src, 0, 0, width, height, 'none');
    fill(0, 160);
    noStroke();
    rect(0, height / 2 - 30, width, 60);
    fill(255);
    textSize(24);
    textAlign(CENTER, CENTER);
    text('Looking for a face...', width / 2, height / 2);
    maybeSendPreview(vw, vh, boxes);
    return;
  }

  // project each highlighted box onto the screen: one fills it, several tile it so the whole screen is used
  const n = boxes.length;
  const g = bestGrid(n, width, height);
  boxes.forEach((b, i) => {
    const r = Math.floor(i / g.cols);
    const c = i % g.cols;
    const inRow = Math.min(g.cols, n - r * g.cols); // the last row may be shorter: center it
    const ox = (width - inRow * g.cellW) / 2 + c * g.cellW;
    const oy = r * g.cellH;
    // show a patch the same shape as the tile (same area as the square box) so nothing is stretched
    const patch = aspectRect(vw, vh, b.from, b.side, g.cellW / g.cellH);
    drawFiltered(ctx, zoomedIn(patch), ox, oy, g.cellW, g.cellH, fxIn);
    if (showLabels) drawLabel(ctx, b.label, ox + g.cellW / 2, oy + g.cellH / 2, constrain(Math.min(g.cellW, g.cellH) / 12, 14, 40));
  });

  maybeSendPreview(vw, vh, boxes);
}

// ---- body trace ----

// Switch Body Trace on or off. The body model is big, so it is only loaded (and only runs) while it is on.
function setBodyTrace(on) {
  bodyTrace = on;
  if (on) screenTrace = false; // one mosaic mode at a time
  if (!on) {
    if (bodySegRunning) bodySeg.detectStop();
    bodySegRunning = false;
    return;
  }
  if (!bodySeg) {
    bodySeg = ml5.bodySegmentation('SelfieSegmentation', { maskType: 'background' }, () => {
      bodySegReady = true;
      publishState(); // the controller stops showing "loading"
    });
  }
}

// Screen Trace: the same mosaic, but over the whole screen. It needs no body model.
function setScreenTrace(on) {
  screenTrace = on;
  if (on) setBodyTrace(false);
}

// Give the body model a small copy of the camera picture, start it if needed, and keep the silhouette fresh.
function feedBodyModel(vw, vh) {
  const h = Math.round((SEG_WIDTH * vh) / vw);
  if (!segCanvas) segCanvas = document.createElement('canvas');
  if (segCanvas.width !== SEG_WIDTH || segCanvas.height !== h) {
    segCanvas.width = SEG_WIDTH;
    segCanvas.height = h;
  }
  segCanvas.getContext('2d').drawImage(video.elt, 0, 0, SEG_WIDTH, h);
  if (bodySegReady && !bodySegRunning) {
    bodySegRunning = true;
    bodySeg.detectStart(segCanvas, (result) => {
      if (result && result.maskImageData) latestMask = result.maskImageData;
    });
  }
}

function drawMosaic(ctx, vw, vh, view, inUse) {
  // Body Trace only paints tiles that lie on the person; Screen Trace paints every tile.
  let isPerson = () => true;
  if (!screenTrace) {
    feedBodyModel(vw, vh);

    // until the first silhouette arrives (the model is still loading) just show the camera
    if (!latestMask) {
      drawFiltered(ctx, view.src, 0, 0, width, height, 'none');
      return;
    }

    // The mask can come either way round (person opaque or background opaque). We know where a person is: their
    // nose. Whatever the mask says at the nose is "person".
    const mw = latestMask.width;
    const mh = latestMask.height;
    const alphaAt = (vx, vy) => {
      const x = constrain(Math.floor((vx / vw) * mw), 0, mw - 1);
      const y = constrain(Math.floor((vy / vh) * mh), 0, mh - 1);
      return latestMask.data[(y * mw + x) * 4 + 3];
    };
    if (tracks.length > 0) maskPersonOpaque = alphaAt(tracks[0].x, tracks[0].y) > 127;
    isPerson = (vx, vy) => alphaAt(vx, vy) > 127 === maskPersonOpaque;
  }

  const T = Math.max(8, Math.round((tileSize * Math.min(width, height)) / 800));
  const cols = Math.ceil(width / T);
  const rows = Math.ceil(height / T);
  if (mosaicKey !== `${cols}x${rows}`) {
    mosaicKey = `${cols}x${rows}`;
    mosaicCells = Array.from({ length: cols * rows }, () => ({ fi: -1, pid: -1 }));
  }
  const feats = [...inUse];
  const reach = T * 0.3;
  let drawn = 0;

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cx = c * T + T / 2;
      const cy = r * T + T / 2;
      // a tile counts as body when most of 5 sample points inside it are on the person
      let hits = screenTrace ? 5 : 0;
      for (const [dx, dy] of [[0, 0], [-reach, -reach], [reach, -reach], [-reach, reach], [reach, reach]]) {
        const vx = (width - (cx + dx) - view.ox) / view.scale; // undo the mirroring and the cover scaling
        const vy = (cy + dy - view.oy) / view.scale;
        if (!screenTrace && isPerson(vx, vy)) hits++;
      }
      if (hits < 3) continue;

      // each tile picks a random highlighted feature of a random person, and now and then picks again
      const cell = mosaicCells[r * cols + c];
      const stale = cell.fi < 0 || !feats.includes(cell.fi) || !tracks.some((t) => t.id === cell.pid);
      if (stale || Math.random() < 0.012) {
        cell.fi = feats[Math.floor(Math.random() * feats.length)];
        cell.pid = tracks.length ? tracks[Math.floor(Math.random() * tracks.length)].id : -1;
      }
      const at = smooth[`${cell.pid}:${cell.fi}`];
      if (!at) continue;
      const patch = zoomedIn(squareRect(vw, vh, at, boxSide(vw, vh, FEATURES[cell.fi].size)));
      drawFiltered(ctx, patch, c * T + 1, r * T + 1, T - 2, T - 2, fxIn);
      drawn++;
    }
  }

  // nothing to show yet (no face found): show the plain camera instead of a dead black screen
  if (drawn === 0) drawFiltered(ctx, view.src, 0, 0, width, height, 'none');
}

// How the camera fills the canvas without stretching ("cover": the longer side is cropped).
//   src:      the part of the camera picture that is visible
//   toCanvas: where a rect of the camera picture lands on the canvas (mirrored left-right like a selfie view)
function coverView(vw, vh) {
  const scale = Math.max(width / vw, height / vh);
  const ox = (width - vw * scale) / 2;
  const oy = (height - vh * scale) / 2;
  return {
    scale,
    ox,
    oy,
    src: { sx: -ox / scale, sy: -oy / scale, sw: width / scale, sh: height / scale },
    toCanvas: (r) => ({ x: width - (ox + (r.sx + r.sw) * scale), y: oy + r.sy * scale, w: r.sw * scale, h: r.sh * scale }),
  };
}

// side of a feature's square in camera pixels. `size` is in "800 pixel screen" units, so boxes keep their
// proportions on any screen.
function boxSide(vw, vh, size) {
  return (size * Math.min(vw, vh)) / 800;
}

// a square of the camera picture centered on `pt`, kept inside the picture
function squareRect(vw, vh, pt, side) {
  return {
    sx: constrain(pt.x - side / 2, 0, vw - side),
    sy: constrain(pt.y - side / 2, 0, vh - side),
    sw: side,
    sh: side,
  };
}

// a patch centered on `pt` with the given width/height ratio and the same area as the square box
function aspectRect(vw, vh, pt, side, aspect) {
  let sw = side * Math.sqrt(aspect);
  let sh = side / Math.sqrt(aspect);
  const k = Math.min(1, vw / sw, vh / sh); // shrink (keeping the shape) if it would stick out of the picture
  sw *= k;
  sh *= k;
  return { sx: constrain(pt.x - sw / 2, 0, vw - sw), sy: constrain(pt.y - sh / 2, 0, vh - sh), sw, sh };
}

// the tile layout whose tiles are closest to square, so the tiles fill the screen
function bestGrid(n, W, H) {
  let best = null;
  for (let cols = 1; cols <= n; cols++) {
    const rows = Math.ceil(n / cols);
    const cellW = W / cols;
    const cellH = H / rows;
    const score = Math.abs(Math.log(cellW / cellH));
    if (!best || score < best.score) best = { cols, rows, cellW, cellH, score };
  }
  return best;
}

// Only while the iPad is connected, about 10 times a second: draw the small preview and send it over as a JPEG.
function maybeSendPreview(vw, vh, boxes) {
  if (links.size === 0 || millis() - lastPreviewAt < 100) return;
  lastPreviewAt = millis();
  const ph = Math.round((PREVIEW * vh) / vw);
  if (preview.width !== PREVIEW || preview.height !== ph) preview.resizeCanvas(PREVIEW, ph);
  drawPreview(vw, vh, boxes, ph);
  const img = preview.elt.toDataURL('image/jpeg', 0.6);
  for (const c of links) {
    const backedUp = c.dataChannel && c.dataChannel.bufferedAmount > 200000; // skip frames if the link is behind
    if (c.open && !backedUp) c.send({ type: 'frame', img });
  }
}

// small mirrored preview of the whole camera picture (shown on the iPad) with the highlighted squares outlined
function drawPreview(vw, vh, boxes, ph) {
  preview.background(0);
  const pctx = preview.drawingContext;
  drawFiltered(pctx, { sx: 0, sy: 0, sw: vw, sh: vh }, 0, 0, PREVIEW, ph, fxOut);

  const k = PREVIEW / vw;
  for (const b of boxes) {
    const r = squareRect(vw, vh, b.at, b.side);
    // mirror x to match the flipped preview
    const x = PREVIEW - (r.sx + r.sw) * k;
    const y = r.sy * k;
    const w = r.sw * k;
    drawFiltered(pctx, zoomedIn(squareRect(vw, vh, b.from, b.side)), x, y, w, w, fxIn);
    preview.noFill();
    preview.stroke(BTN_COLOR);
    preview.strokeWeight(2);
    preview.rect(x, y, w, w);
    if (showLabels) drawLabel(pctx, b.label, x + w / 2, y + w / 2, 11);
  }
}

// Draw a rect of the camera (raw pixel rect `box`) into the destination rect (dx, dy, dw, dh) of `ctx`,
// mirrored like the rest of the view, with the given filter mode applied to just that region.
// The filters use canvas blend modes (no per-pixel JavaScript), so they stay fast:
//   mono: a black fill in "saturation" mode strips the color
//   duo:  then a #00ff00 fill in "multiply" mode maps black -> black and white -> #00ff00
function drawFiltered(ctx, box, dx, dy, dw, dh, mode) {
  ctx.save();
  ctx.translate(dx + dw, dy);
  ctx.scale(-1, 1);
  ctx.drawImage(video.elt, box.sx, box.sy, box.sw, box.sh, 0, 0, dw, dh);
  if (mode !== 'none') {
    ctx.globalCompositeOperation = 'saturation';
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, dw, dh);
    if (mode === 'duo') {
      ctx.globalCompositeOperation = 'multiply';
      ctx.fillStyle = BTN_COLOR;
      ctx.fillRect(0, 0, dw, dh);
    }
  }
  ctx.restore();
}

// Feature name in plain white monospace, centered on (cx, cy).
function drawLabel(ctx, text, cx, cy, size) {
  ctx.save();
  ctx.font = `${size}px monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  ctx.fillText(text, cx, cy);
  ctx.restore();
}

// The part of the box that is actually shown: a smaller rect around the same center (zoom 1 = the whole box).
function zoomedIn(box) {
  const sw = box.sw / zoom;
  const sh = box.sh / zoom;
  return { sx: box.sx + (box.sw - sw) / 2, sy: box.sy + (box.sh - sh) / 2, sw, sh };
}

// ---- several people ----

function clearSmooth(idx) {
  for (const k in smooth) if (idx === undefined || k.endsWith(`:${idx}`)) delete smooth[k];
}

// Match this frame's faces to the people seen before (nearest nose position), add newcomers, drop people who left.
function updatePeople() {
  const vw = video.elt.videoWidth || video.width;
  const maxMove = vw * 0.25; // a face further than this from every known person is someone new
  const used = new Set();
  for (const face of faces) {
    const nose = face.keypoints && face.keypoints[1];
    if (!nose) continue;
    let best = null;
    let bestDist = maxMove;
    for (const t of tracks) {
      if (used.has(t)) continue;
      const d = dist(nose.x, nose.y, t.x, t.y);
      if (d < bestDist) {
        bestDist = d;
        best = t;
      }
    }
    if (!best) {
      best = { id: nextPersonId++ };
      tracks.push(best);
    }
    Object.assign(best, { x: nose.x, y: nose.y, face, lastSeen: millis() });
    used.add(best);
  }

  for (let i = tracks.length - 1; i >= 0; i--) {
    if (millis() - tracks[i].lastSeen > GRACE_MS) {
      for (const k in smooth) if (k.startsWith(`${tracks[i].id}:`)) delete smooth[k];
      tracks.splice(i, 1);
    }
  }
  tracks.sort((a, b) => a.id - b.id);

  const key = tracks.map((t) => t.id).join(',');
  if (key !== peopleKey) {
    peopleKey = key; // someone arrived or left: switch the features around
    shuffleFeatures();
    publishStatus();
  }
}

// For every feature, hand each person someone else's version of it (a random rotation, so nobody keeps their own).
function shuffleFeatures() {
  const ids = tracks.map((t) => t.id);
  FEATURES.forEach((_, idx) => {
    const map = {};
    const shift = ids.length > 1 ? floor(random(1, ids.length)) : 0;
    ids.forEach((id, i) => (map[id] = ids[(i + shift) % ids.length]));
    perms[idx] = map;
  });
}

// ---- actions (the controller triggers these) ----

// switch a feature on or off; any number (including none) can be on at once
function toggleFeature(idx) {
  if (selected.has(idx)) {
    selected.delete(idx);
    if (current === idx && selected.size > 0) current = [...selected].pop();
  } else {
    selected.add(idx);
    clearSmooth(idx); // jump straight to the face instead of gliding in from an old position
    current = idx;
  }
}

// one random feature, a random zoom, a random inside filter and labels on or off
function randomize() {
  const next = floor(random(FEATURES.length));
  selected.clear();
  clearSmooth();
  selected.add(next);
  current = next;
  zoom = round(random(MIN_ZOOM, RANDOM_MAX_ZOOM) * 10) / 10;
  fxIn = random(MODES);
  showLabels = random() < 0.5;
  shuffleFeatures();
}

// arrow keys / space (on the laptop): jump to a single feature
function cycle(dir) {
  const next = (current + dir + FEATURES.length) % FEATURES.length;
  selected.clear();
  clearSmooth();
  selected.add(next);
  current = next;
  publishState();
}

function keyPressed() {
  if (keyCode === RIGHT_ARROW || key === ' ') cycle(1);
  if (keyCode === LEFT_ARROW) cycle(-1);
}

function applyCommand(c) {
  if (!c || typeof c.name !== 'string') return;
  const validIdx = Number.isInteger(c.idx) && c.idx >= 0 && c.idx < FEATURES.length;
  switch (c.name) {
    case 'toggleFeature':
      if (validIdx) toggleFeature(c.idx);
      break;
    case 'setSize':
      if (validIdx && isFinite(c.value)) FEATURES[c.idx].size = constrain(Number(c.value), MIN_SIZE, MAX_SIZE);
      break;
    case 'setZoom':
      if (isFinite(c.value)) zoom = constrain(Number(c.value), MIN_ZOOM, MAX_ZOOM);
      break;
    case 'setTileSize':
      if (isFinite(c.value)) tileSize = constrain(Number(c.value), MIN_TILE, MAX_TILE);
      break;
    case 'toggleScreenTrace':
      setScreenTrace(!screenTrace);
      break;
    case 'toggleBodyTrace':
      setBodyTrace(!bodyTrace);
      break;
    case 'toggleFull':
      fullView = !fullView;
      break;
    case 'toggleLabels':
      showLabels = !showLabels;
      break;
    case 'setFxIn':
      if (MODES.includes(c.mode)) fxIn = c.mode;
      break;
    case 'setFxOut':
      if (MODES.includes(c.mode)) fxOut = c.mode;
      break;
    case 'randomize':
      randomize();
      break;
    case 'shuffle':
      shuffleFeatures();
      break;
    case 'setCamera':
      if (typeof c.id === 'string' && c.id !== activeCamera) startCamera(c.id);
      break;
  }
  publishState();
}

// ---- cameras ----

// (Re)start the webcam on a specific camera and point face tracking at it.
// Every camera switch builds a fresh faceMesh model: re-pointing one running model at a new video
// is unreliable (its loop can die on the old, stopped stream), which left tracking dead on the new camera.
function startCamera(deviceId) {
  const firstStart = !video;
  if (video) {
    faceMesh.detectStop();
    video.remove(); // also stops the old camera stream
  }
  faces = [];
  tracks.length = 0; // everyone is re-detected from the new camera
  peopleKey = '';
  clearSmooth();
  const constraints = { video: { width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }; // wide picture for full-screen use
  if (deviceId) constraints.video.deviceId = { exact: deviceId };
  const vid = createCapture(constraints, listCameras);
  video = vid;
  vid.hide();
  // The face tracker reports positions in the video element's own width/height, so that must equal the camera's
  // real pixel size. (Forcing the element to 800x800 while the camera sends 1280x720 put every box in the wrong place.)
  vid.elt.addEventListener('loadedmetadata', () => {
    vid.elt.width = vid.elt.videoWidth;
    vid.elt.height = vid.elt.videoHeight;
  });

  const startTracking = () => {
    if (vid !== video) return; // the user already switched to another camera
    const model = faceMesh;
    model.detectStart(vid, (results) => {
      if (model === faceMesh) faces = results; // ignore results from an old model
    });
  };
  if (firstStart) {
    startTracking(); // the model loaded in preload()
  } else {
    faceMesh = ml5.faceMesh({ maxFaces: MAX_PEOPLE }, startTracking);
  }
}

// Collect every connected camera for the controller's list. Names only appear once camera permission
// is granted, which is why this runs after the first stream starts.
async function listCameras() {
  const devices = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'videoinput');
  const stream = video && video.elt.srcObject;
  const track = stream && stream.getVideoTracks()[0];
  activeCamera = track ? track.getSettings().deviceId : null;
  cameras = devices.map((d, i) => ({ id: d.deviceId, label: d.label || `Camera ${i + 1}` }));
  publishStatus();
  publishState();
}
if (navigator.mediaDevices) {
  navigator.mediaDevices.addEventListener('devicechange', () => video && listCameras()); // e.g. plugging in a webcam
}

// ---- talking to the iPad (PeerJS: a direct browser-to-browser link, no server of our own) ----

function send(msg) {
  for (const c of links) if (c.open) c.send(msg);
}

function publishState() {
  send({
    type: 'state',
    state: {
      features: FEATURES.map((f) => ({ label: f.label, size: f.size })),
      selected: [...selected],
      current,
      zoom,
      fullView,
      bodyTrace,
      screenTrace,
      bodyLoading: bodyTrace && !bodySegReady,
      tileSize,
      showLabels,
      fxIn,
      fxOut,
    },
  });
}

function publishStatus() {
  send({ type: 'status', status: { people: tracks.length, cameras, activeCamera } });
}

function connect() {
  peer = new Peer('faceproj-' + PAIRING_CODE);
  peer.on('error', (err) => {
    if (err.type === 'unavailable-id') {
      // the code is still held by an older copy of this page (e.g. just refreshed): try again in a moment
      peer.destroy();
      setTimeout(connect, 2000);
    } else {
      console.warn('Connection problem:', err.type);
    }
  });
  peer.on('disconnected', () => peer.reconnect());
  peer.on('connection', (conn) => {
    conn.on('open', () => {
      links.add(conn);
      publishState();
      publishStatus();
    });
    conn.on('data', (m) => {
      if (m && m.type === 'cmd') applyCommand(m.cmd);
    });
    const gone = () => links.delete(conn);
    conn.on('close', gone);
    conn.on('error', gone);
  });
}
