<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Face Projection (Controller)</title>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #111; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
      /* everything is sized to the screen: one grid that is exactly as tall as the window, nothing scrolls */
      main {
        height: 100vh; height: 100dvh; box-sizing: border-box; padding: 10px; gap: 8px;
        display: grid; grid-template-rows: auto minmax(0, 1fr);
        font-size: clamp(11px, 2.1vmin, 20px);
      }
      .info { color: #00ff00; font-family: monospace; font-size: 0.8em; text-align: center; }
      .info.bad { color: #ff5555; }
      .layout { display: grid; grid-template-columns: 1fr 1.8fr 1fr; gap: 10px; min-height: 0; }
      .subcols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; min-height: 0; }
      .col { display: flex; flex-direction: column; gap: 8px; min-height: 0; min-width: 0; }
      .btn, select {
        box-sizing: border-box; width: 100%; padding: 0 6px; border: none; border-radius: 8px;
        background: #00ff00; color: #000; font-family: monospace; font-size: 1em; line-height: 1.15; cursor: pointer;
      }
      .btn { flex: 1 1 0; min-height: 0; }  /* buttons share the column's height equally */
      select { flex: none; padding: 0.7em 6px; }
      .heading { flex: none; color: #00ff00; font-family: monospace; font-size: 0.8em; text-align: center; }
      .preview { flex: none; width: 100%; height: auto; max-height: 38vh; object-fit: contain; background: #000; border: 2px solid #00ff00; box-sizing: border-box; }
      .slider-box {
        flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 10px;
        border: 2px solid #00ff00; border-radius: 8px; padding: 10px; box-sizing: border-box;
        color: #00ff00; font-family: monospace; font-size: 0.9em; text-align: center;
      }
      /* big, easy-to-grab slider knobs */
      .slider-box input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 3.6em; margin: 0; background: transparent; }
      .slider-box input[type=range]::-webkit-slider-runnable-track { height: 0.8em; background: #0b5f0b; border-radius: 1em; }
      .slider-box input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 3em; height: 3em; margin-top: -1.1em; border-radius: 50%; background: #00ff00; border: 3px solid #000; box-shadow: 0 0 0 2px #00ff00; }
      .slider-box input[type=range]::-moz-range-track { height: 0.8em; background: #0b5f0b; border-radius: 1em; }
      .slider-box input[type=range]::-moz-range-thumb { width: 3em; height: 3em; box-sizing: border-box; border-radius: 50%; background: #00ff00; border: 3px solid #000; box-shadow: 0 0 0 2px #00ff00; }
      .btnrow { flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; }  /* Body Trace, with Screen Trace under it */
      .btnrow .btn.fixed { flex: 0 0 auto; padding: 0.9em 6px; }
      /* on very short screens (e.g. a phone on its side) the knobs shrink a little so the three cards still fit */
      @media (max-height: 480px) {
        .slider-box { gap: 2px; padding: 6px; }
        .slider-box input[type=range] { height: 2.6em; }
        .slider-box input[type=range]::-webkit-slider-thumb { width: 2.2em; height: 2.2em; margin-top: -0.7em; }
        .slider-box input[type=range]::-moz-range-thumb { width: 2.2em; height: 2.2em; }
      }
      .btn.fixed { flex: 0 0 auto; padding: 1.1em 6px; }
      .ends { display: flex; justify-content: space-between; font-size: 0.8em; }
    </style>
  </head>
  <body>
    <main></main>
    <script>
// The iPad side: all the buttons and sliders. It sends commands straight to the sketch on the laptop
// (a direct browser-to-browser link made with PeerJS, using the pairing code) and redraws itself from the
// state the sketch sends back, so it always shows what is really happening.

// Same order as FEATURES in sketch.html (features are referred to by index).
const FEATURE_LABELS = ['Left Eye', 'Right Eye', 'Left Eyebrow', 'Right Eyebrow', 'Nose', 'Mouth'];

const MIN_SIZE = 20;
const MAX_SIZE = 300;
const MIN_ZOOM = 1;
const MAX_ZOOM = 5;
const MIN_TILE = 14; // mosaic tile size range, same as the sketch
const MAX_TILE = 120;

let peer;         // our end of the PeerJS link
let conn;         // the link to the sketch on the laptop
// Same pairing code as the sketch page, so the connection happens on its own.
// To use your own code, put it in both addresses: sketch.html#MYCODE and controller.html#MYCODE.
const DEFAULT_CODE = 'FP-X7K2Q9M4';
const PAIRING_CODE = (location.hash.slice(1) || DEFAULT_CODE).toUpperCase();
let previewImg;
let retryTimer;
let problem = '';
let linked = false;
let state = null; // what the sketch last reported
let sketchStatus = { people: 0, cameras: [], activeCamera: null };

let screenBtn, tileLabel, tileSlider, bodyBtn, infoLine, camSelect, shuffleBtn, fullBtn, labelsBtn, sizeLabel, sizeSlider, zoomLabel, zoomSlider;
const featBtns = [];
const fxBtns = { in: {}, out: {} };
let cameraListKey = '';
const dragging = new Set(); // sliders being dragged right now (don't fight the user's finger)

function setup() {
  noCanvas();
  const root = select('main');

  infoLine = createDiv('Connecting...').class('info').parent(root);
  const layout = createDiv().class('layout').parent(root);

  // column 1: camera preview, camera choice, shuffle, randomize
  const left = createDiv().class('col').parent(layout);
  previewImg = createImg('data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==', 'camera preview').class('preview').parent(left);
  camSelect = createSelect().parent(left);
  camSelect.changed(() => send({ name: 'setCamera', id: camSelect.value() }));
  shuffleBtn = createButton('Shuffle Features').class('btn').parent(left);
  tap(shuffleBtn, () => send({ name: 'shuffle' }));
  tap(createButton('Randomize').class('btn').parent(left), () => send({ name: 'randomize' }));

  // column 2 is two columns: the features, then labels and the colour filters
  const mid = createDiv().class('subcols').parent(layout);

  const featCol = createDiv().class('col').parent(mid);
  FEATURE_LABELS.forEach((label, idx) => {
    const b = createButton(label).class('btn').parent(featCol);
    tap(b, () => send({ name: 'toggleFeature', idx }));
    featBtns[idx] = b;
  });
  fullBtn = createButton('Full View').class('btn').parent(featCol);
  tap(fullBtn, () => send({ name: 'toggleFull' }));

  const fxCol = createDiv().class('col').parent(mid);
  labelsBtn = createButton('Labels').class('btn').parent(fxCol);
  tap(labelsBtn, () => send({ name: 'toggleLabels' }));
  [['in', 'INSIDE BOX', 'setFxIn'], ['out', 'OUTSIDE BOX', 'setFxOut']].forEach(([target, heading, cmd]) => {
    createDiv(heading).class('heading').parent(fxCol);
    [['mono', 'Monochrome'], ['duo', 'Duotone']].forEach(([mode, label]) => {
      const b = createButton(label).class('btn').parent(fxCol);
      // pressing the active filter again turns it off
      tap(b, () => {
        if (!state) return;
        const now = target === 'in' ? state.fxIn : state.fxOut;
        send({ name: cmd, mode: now === mode ? 'none' : mode });
      });
      fxBtns[target][mode] = b;
    });
  });

  // column 3: the sliders
  const right = createDiv().class('col').parent(layout);

  // body trace: the person's silhouette filled with a mosaic of the highlighted features
  // (and Screen Trace: the same mosaic over the whole screen)
  const traceRow = createDiv().class('btnrow').parent(right);
  bodyBtn = createButton('Body Trace').class('btn fixed').parent(traceRow);
  tap(bodyBtn, () => send({ name: 'toggleBodyTrace' }));
  screenBtn = createButton('Screen Trace').class('btn fixed').parent(traceRow);
  tap(screenBtn, () => send({ name: 'toggleScreenTrace' }));

  // box size (flipped: higher value = smaller box = more zoomed in)
  const sizeBox = createDiv().class('slider-box').parent(right);
  sizeLabel = createDiv('BOX SIZE').parent(sizeBox);
  sizeSlider = createSlider(MIN_SIZE, MAX_SIZE, MIN_SIZE + MAX_SIZE - 100, 1).parent(sizeBox);
  const ends = createDiv().class('ends').parent(sizeBox);
  createSpan('LARGE').parent(ends);
  createSpan('SMALL').parent(ends);
  sizeSlider.input(() => {
    if (state) send({ name: 'setSize', idx: state.current, value: MIN_SIZE + MAX_SIZE - sizeSlider.value() });
  });
  holdWhileDragging(sizeSlider, 'size');

  // zoom
  const zoomBox = createDiv().class('slider-box').parent(right);
  zoomLabel = createDiv('ZOOM INSIDE BOX').parent(zoomBox);
  zoomSlider = createSlider(MIN_ZOOM, MAX_ZOOM, MIN_ZOOM, 0.1).parent(zoomBox);
  const zends = createDiv().class('ends').parent(zoomBox);
  createSpan('1x').parent(zends);
  createSpan('5x').parent(zends);
  zoomSlider.input(() => send({ name: 'setZoom', value: zoomSlider.value() }));
  holdWhileDragging(zoomSlider, 'zoom');

  // mosaic tile size (for Body Trace)
  const tileBox = createDiv().class('slider-box').parent(right);
  tileLabel = createDiv('TILE SIZE').parent(tileBox);
  tileSlider = createSlider(MIN_TILE, MAX_TILE, 28, 1).parent(tileBox);
  const tends = createDiv().class('ends').parent(tileBox);
  createSpan('SMALL').parent(tends);
  createSpan('LARGE').parent(tends);
  tileSlider.input(() => send({ name: 'setTileSize', value: tileSlider.value() }));
  holdWhileDragging(tileSlider, 'tile');

  start();
  render();
}

// plain click listener: reliable for taps on iPad
function tap(el, fn) {
  el.elt.addEventListener('click', fn);
}

function holdWhileDragging(slider, name) {
  const down = () => dragging.add(name);
  const up = () => dragging.delete(name);
  slider.elt.addEventListener('pointerdown', down);
  slider.elt.addEventListener('touchstart', down, { passive: true });
  window.addEventListener('pointerup', up);
  window.addEventListener('touchend', up);
  window.addEventListener('pointercancel', up);
}

function send(cmd) {
  if (conn && conn.open) conn.send({ type: 'cmd', cmd });
}

// draw everything from the latest state
function render() {
  if (linked) {
    infoLine.html('Connected to the sketch');
    infoLine.removeClass('bad');
  } else {
    infoLine.html(problem || 'Connecting to the sketch... (open sketch.html on the laptop)');
    infoLine.addClass('bad');
  }

  const n = sketchStatus.people;
  shuffleBtn.html(`Shuffle Features (${n} ${n === 1 ? 'person' : 'people'})`);

  // camera list: only rebuilt when it changes, so an open dropdown doesn't snap shut
  const key = JSON.stringify(sketchStatus.cameras);
  if (key !== cameraListKey) {
    cameraListKey = key;
    camSelect.elt.innerHTML = '';
    sketchStatus.cameras.forEach((c) => camSelect.option(c.label, c.id));
    if (sketchStatus.cameras.length === 0) camSelect.option('No camera found yet', '');
  }
  if (sketchStatus.activeCamera) camSelect.selected(sketchStatus.activeCamera);

  if (!state) return;
  const dim = (btn, on) => btn.style('opacity', on ? '1' : '0.35');
  featBtns.forEach((b, i) => dim(b, state.selected.includes(i)));
  dim(fullBtn, state.fullView);
  dim(bodyBtn, state.bodyTrace);
  dim(screenBtn, state.screenTrace);
  bodyBtn.html(state.bodyLoading ? 'Body Trace (loading model...)' : 'Body Trace');
  dim(labelsBtn, state.showLabels);
  for (const m in fxBtns.in) dim(fxBtns.in[m], state.fxIn === m);
  for (const m in fxBtns.out) dim(fxBtns.out[m], state.fxOut === m);

  sizeLabel.html(`BOX SIZE: ${state.features[state.current].label.toUpperCase()}`);
  if (!dragging.has('size')) sizeSlider.value(MIN_SIZE + MAX_SIZE - state.features[state.current].size);
  tileLabel.html(`TILE SIZE: ${Math.round(state.tileSize)}`);
  if (!dragging.has('tile')) tileSlider.value(state.tileSize);
  zoomLabel.html(`ZOOM INSIDE BOX: ${state.zoom.toFixed(1)}x`);
  if (!dragging.has('zoom')) zoomSlider.value(state.zoom);
}

// ---- the link to the laptop (PeerJS: a direct browser-to-browser connection) ----

function start() {
  peer = new Peer();
  peer.on('open', () => linkTo());
  peer.on('disconnected', () => peer.reconnect());
  peer.on('error', (err) => {
    if (err.type === 'peer-unavailable') {
      problem = "Can't find the sketch. Is sketch.html open on the laptop?";
      retry();
    } else {
      problem = 'Connection problem: ' + err.type;
    }
    render();
  });
}

function linkTo() {
  if (!peer || !peer.open) return;
  problem = '';
  clearTimeout(retryTimer);
  if (conn) conn.close();
  conn = peer.connect('faceproj-' + PAIRING_CODE, { reliable: true });
  conn.on('open', () => {
    linked = true;
    problem = '';
    render();
  });
  conn.on('data', (m) => {
    if (!m) return;
    if (m.type === 'frame') {
      previewImg.elt.src = m.img; // only the picture changes, no need to redraw the controls
      return;
    }
    if (m.type === 'state') state = m.state;
    if (m.type === 'status') sketchStatus = m.status;
    render();
  });
  conn.on('close', () => {
    linked = false;
    problem = 'Lost the connection. Reconnecting...';
    retry();
    render();
  });
  render();
}

// keep trying, e.g. if the laptop page was refreshed
function retry() {
  clearTimeout(retryTimer);
  retryTimer = setTimeout(linkTo, 2500);
}
    </script>
  </body>
</html>
